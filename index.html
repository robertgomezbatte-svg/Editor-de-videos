<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mini Editor de Reels</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Mini Editor de Reels</h1>

<input type="file" id="videoInput" accept="video/*" />
<br><br>

<label>Velocidad:</label>
<select id="speed">
  <option value="1">Normal</option>
  <option value="1.25">1.25x</option>
  <option value="1.5">1.5x</option>
  <option value="2">2x</option>
</select>

<br><br>

<label>Transición:</label>
<select id="transition">
  <option value="none">Ninguna</option>
  <option value="bounce">Rebote</option>
  <option value="fade">Fade negro</option>
  <option value="flash">Flash</option>
</select>

<br><br>

<label>Música (opcional):</label>
<input type="file" id="musicInput" accept="audio/*" />

<br><br>

<button id="processBtn">Procesar vídeo</button>

<p id="status"></p>

<video id="preview" controls></video>

<!-- TIMELINE -->
<div id="timelineContainer">
  <div id="timeline">
    <div id="selection"></div>
    <div id="playhead"></div>
  </div>

  <div class="timeline-buttons">
    <button id="setIn">IN</button>
    <button id="setOut">OUT</button>
    <button id="addCut">Añadir corte</button>
    <button id="clearCuts">Limpiar</button>
  </div>

  <ul id="cutsList"></ul>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
<script src="script.js"></script>

</body>
</html>
