<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mini Reels Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <h1>Mini Reels Editor</h1>
  </header>

  <div class="workspace">

    <!-- PANEL IZQUIERDO -->
    <div class="controls">

      <div class="control-group">
        <label>Vídeo</label>
        <input type="file" id="videoInput" accept="video/*" />
      </div>

      <div class="control-group">
        <label>Velocidad</label>
        <select id="speed">
          <option value="1">Normal</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>

      <div class="control-group">
        <label>Transición</label>
        <select id="transition">
          <option value="none">Ninguna</option>
          <option value="bounce">Rebote</option>
          <option value="fade">Fade</option>
          <option value="flash">Flash</option>
        </select>
      </div>

      <div class="control-group">
        <label>Preset exportación</label>
        <select id="preset">
          <option value="instagram">Instagram</option>
          <option value="high">Alta calidad</option>
          <option value="light">Ligero</option>
        </select>
      </div>

      <div class="control-group">
        <label>Música</label>
        <input type="file" id="musicInput" accept="audio/*" />
      </div>

      <!-- TEXTO -->
      <div class="control-group">
        <label>Texto</label>

        <input type="text" id="textInput" placeholder="Texto seleccionado..." />

        <label class="small">Tamaño</label>
        <input type="range" id="textSize" min="16" max="80" />

        <label class="small">Color</label>
        <input type="color" id="textColor" />

        <button id="addTextBtn">Añadir texto</button>
        <button id="deleteTextBtn">Eliminar texto</button>
      </div>

      <div class="buttons">
        <button id="processBtn" class="primary">Exportar</button>
        <button id="saveProject">Guardar</button>
        <input type="file" id="loadProject" accept=".json" />
      </div>

      <p id="status"></p>

    </div>

    <!-- PANEL DERECHO -->
    <div class="editor">

      <div class="video-wrapper">
        <video id="preview" controls></video>
        <div id="textLayer"></div>
      </div>

      <div id="timelineContainer">
        <div id="timeline">
          <div id="selection">
            <div class="handle left"></div>
            <div class="handle right"></div>
          </div>
          <div id="playhead"></div>
        </div>

        <div class="timeline-buttons">
          <button id="addCut">Añadir corte</button>
          <button id="clearCuts">Limpiar</button>
        </div>

        <ul id="cutsList"></ul>
      </div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
<script src="script.js"></script>

</body>
</html>
